<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ADM | N10STORE</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand">N10<span>STORE</span></div>
  <p class="eyebrow">ÁREA RESTRITA</p>
  <h1>Bem-vindo de volta</h1>
  <p class="muted">Entre para administrar sua loja.</p>
  <form id="loginForm">
    <label>Usuário
      <input name="username" autocomplete="username" required>
    </label>
    <label>Senha
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="gold" type="submit">Entrar no painel</button>
    <p id="message" class="message"></p>
  </form>
  <a class="back" href="/">← Voltar para a loja</a>
</main>
<script>
const form = document.querySelector("#loginForm");
const message = document.querySelector("#message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "Verificando acesso…";

  const data = new FormData(form);

  try {
    const response = await fetch("/api/admin/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: data.get("username"),
        password: data.get("password")
      })
    });

    const result = await response.json();

    if (!response.ok) throw new Error(result.error || "Falha no login.");

    location.href = "/admin/painel";
  } catch (error) {
    message.textContent = error.message;
  }
});
</script>
</body>
</html>
